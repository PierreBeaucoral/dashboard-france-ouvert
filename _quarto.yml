project:
  type: website
  output-dir: _site
  # Génère assets/geo/communes.json + assets/data/** (géométrie et colonnes
  # mises en cache par le navigateur) à partir de data/processed/.
  pre-render:
    - R/build_web_assets.R
    - R/build_thumbnails.R
  render:
    - index.qmd
    - pages/*.qmd
    - docs/*.qmd
  # assets/ copié tel quel dans _site (image de partage Open Graph)
  resources:
    - assets/

website:
  title: "France · Données ouvertes"
  description: "Tableau de bord exploratoire des communes françaises : sources data.gouv.fr croisées (élections, immobilier, air, sécurité, finances, santé, revenus, démographie, énergie, mobilité, agriculture, logement, risques, services)."
  favicon: assets/favicon.svg
  # site-url active la génération automatique de sitemap.xml (référencement)
  site-url: "https://pierrebeaucoral.github.io/dashboard-france-ouvert"
  # Aperçu riche quand le lien est partagé sur réseaux sociaux / messageries
  open-graph:
    locale: fr_FR
    image: /assets/og-card.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: /assets/og-card.png
  navbar:
    background: light
    pinned: true
    left:
      - href: index.qmd
        text: Accueil
      - text: Thématiques
        menu:
          - href: pages/elections.qmd
            text: Législatives 2024
          - href: pages/municipales.qmd
            text: Municipales 2026
          - href: pages/immobilier.qmd
            text: Immobilier
          - href: pages/air.qmd
            text: Qualité de l'air
          - href: pages/securite.qmd
            text: Sécurité
          - href: pages/finances.qmd
            text: Finances
          - href: pages/sante.qmd
            text: Santé
          - href: pages/revenus.qmd
            text: Revenus
          - href: pages/demographie.qmd
            text: Démographie & social
          - href: pages/energie.qmd
            text: Énergie · carbone
          - href: pages/mobilite.qmd
            text: Mobilité
          - href: pages/agriculture.qmd
            text: Agriculture bio
          - href: pages/logement.qmd
            text: Logement
          - href: pages/risques.qmd
            text: Risques et sols
          - href: pages/services.qmd
            text: Services et numérique
      - text: Analyse
        menu:
          - href: pages/bivariate.qmd
            text: Carte bivariée
          - href: pages/explorer.qmd
            text: Explorer · corrélations
          - href: pages/classements.qmd
            text: Classements · top / bottom
          - href: pages/profil.qmd
            text: Profil commune · radar 8D
          - href: pages/semblables.qmd
            text: Communes semblables
          - href: pages/departements.qmd
            text: Départements · small multiples
          - href: pages/constellation.qmd
            text: Constellation · carte, population, nuage
      - text: Méthodologie
        menu:
          - href: docs/data-sources.qmd
            text: Sources de données
          - href: docs/decisions.qmd
            text: Décisions méthodologiques
          - href: docs/correlations.qmd
            text: Note sur les corrélations
  page-footer:
    left: "Sources · data.gouv.fr"
    right: "Construit avec Quarto"

format:
  html:
    # tokens.scss (couleurs, source unique, lue aussi par R/theme.R). Quarto empile les
    # couches `defaults` en ordre inverse : tokens.scss, listé en dernier, passe donc en premier.
    theme:
      - cosmo
      - styles/custom.scss
      - styles/tokens.scss
    toc: false
    code-fold: true
    code-tools: false
    code-copy: true
    fig-responsive: true
    smooth-scroll: true
    # Partage d'URL par commune (#codeINSEE) — pages index + docs (format html).
    # Les pages thématiques (format: dashboard) ont le même include dans leur
    # frontmatter : le format dashboard ne fusionne pas cette clé au niveau projet (et une clé
    # `dashboard:` ici ferait rendre index/docs une 2e fois en dashboard, d'où une collision).
    # Applique le thème mémorisé (clé fo-theme, cf. assets/theme.js) avant le premier rendu : pas de flash.
    include-in-header:
      - _includes/theme-init.html
    include-after-body:
      - _includes/after-body.html

execute:
  echo: false
  warning: false
  message: false
  freeze: auto

lang: fr
