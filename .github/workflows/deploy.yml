name: Deploy Quarto site to GitHub Pages

# Rebuild + redeploy on every push to main.
# Uses the parquets committed in data/processed/ (no raw downloads at build time).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency : cancel in-progress deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          # Doit matcher la version enregistrée dans renv.lock (sinon renv
          # avertit et certains binaires peuvent manquer). Voir renv.lock → R.
          r-version: '4.6'
          use-public-rspm: true

      - name: Install system dependencies (sf, leaflet)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libcurl4-openssl-dev

      # renv::restore() installe les versions EXACTES figées dans renv.lock
      # → build reproductible : une breaking change d'un package amont ne
      # casse plus le site. Cache + restore gérés par setup-renv.
      - name: Restore R packages from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Render Quarto site
        run: quarto render
        env:
          QUARTO_LOG_LEVEL: info

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
