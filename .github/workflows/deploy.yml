name: Deploy Quarto site to GitHub Pages

# Rebuild + redeploy on every push to main.
# Uses the parquets committed in data/processed/ (no raw downloads at build time).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency : cancel in-progress deploys
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - name: Install system dependencies (sf, leaflet)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev libcurl4-openssl-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('.github/workflows/deploy.yml') }}

      - name: Install R packages
        run: |
          install.packages(c(
            "arrow", "dplyr", "tidyr", "readr", "stringr", "tibble", "glue",
            "here", "rlang",
            "leaflet", "sf", "htmlwidgets", "htmltools",
            "ggplot2", "ggiraph", "networkD3",
            "jsonlite", "duckdb", "DBI"
          ), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Render Quarto site
        run: quarto render
        env:
          QUARTO_LOG_LEVEL: info

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
