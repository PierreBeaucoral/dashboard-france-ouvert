name: Deploy Quarto site to GitHub Pages

# Rebuild + redeploy on every push to main.
# Uses the parquets committed in data/processed/ (no raw downloads at build time).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency : cancel in-progress deploys
concurrency:
  group: pages
  cancel-in-progress: false

# Le projet a un .Rprofile qui active renv (repro locale). Sur CI on installe
# les binaires Posit dans R_LIBS_USER, donc on désactive l'autoloader renv
# pour que Rscript / quarto utilisent cette librairie, pas la lib renv (vide).
env:
  RENV_CONFIG_AUTOLOADER_ENABLED: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6'

      - name: Install system dependencies (sf, leaflet)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudunits2-dev libgdal-dev libgeos-dev libproj-dev libcurl4-openssl-dev libxml2-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-${{ hashFiles('.github/workflows/deploy.yml') }}

      # Reproductibilité SANS la fragilité de renv-source-build : on installe
      # les binaires précompilés depuis un SNAPSHOT Posit DATÉ (figé). Même date
      # → mêmes versions, à chaque build, en ~3-5 min (pas de compilation).
      # renv.lock reste la référence pour la repro locale exacte (renv::restore).
      - name: Install R packages (Posit binaries, pinned snapshot)
        run: |
          options(repos = c(POSIT = "https://packagemanager.posit.co/cran/__linux__/noble/2026-06-10"))
          install.packages(c(
            "rmarkdown", "knitr",
            "arrow", "dplyr", "tidyr", "readr", "stringr", "tibble", "glue",
            "here", "rlang", "purrr", "readxl", "janitor",
            "leaflet", "sf", "htmlwidgets", "htmltools",
            "ggplot2", "ggiraph", "networkD3",
            "jsonlite", "duckdb", "DBI", "curl"
          ))
        shell: Rscript {0}

      # Filet de sécurité : si un parquet est cassé (schéma changé, fichier
      # tronqué, colonne disparue, valeurs aberrantes), on bloque AVANT le
      # render → jamais de site déployé avec des données corrompues.
      - name: Validate data integrity
        run: Rscript scripts/99_validate_data.R
        shell: bash

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Render Quarto site
        run: quarto render
        env:
          QUARTO_LOG_LEVEL: info

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
